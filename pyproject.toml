[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bluearch-aws-governance"
version = "0.2.6"
description = "BlueArch AWS Governance Hub with bundled misconfiguration catalog."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BlueArch contributors" }]
dependencies = [
    "fastapi>=0.110.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "uvicorn>=0.27.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.scripts]
bluearch-aws-governance = "cloud_governance.cli:app"

[tool.setuptools.packages.find]
include = ["cloud_governance*"]

[tool.setuptools.package-data]
cloud_governance = ["static/*", "static/assets/*", "catalog_seed/by-service/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
